# RabbitMQ Configuration for BankFlow

# Logging
log.console = true
log.console.level = info

# Management plugin
management.load_definitions = /etc/rabbitmq/definitions.json

# Default vhost settings
default_vhost = bankflow
default_user = bankflow
default_pass = bankflow_rabbit_secret

# Connection settings
heartbeat = 60
tcp_listen_options.keepalive = true

# Memory watermark — pause publishers when 60% of RAM used
vm_memory_high_watermark.relative = 0.6
