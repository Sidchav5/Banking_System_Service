# ============================================================
# BankFlow — Full Stack Docker Compose
# Runs: Infrastructure + ALL 11 services + 2 simulators + frontend
#
# Usage:
#   docker compose -f docker-compose.full.yml up --build
#   docker compose -f docker-compose.full.yml down -v
#
# Prerequisites:
#   Set DATABASE_URL, JWT_SECRET, etc. in .env
# ============================================================

networks:
  bankflow-network:
    driver: bridge
    name: bankflow-network

volumes:
  redis-data:
  kafka-data:
  rabbitmq-data:

# ─── Re-usable env anchors ────────────────────────────────────────────────────
x-common-env: &common-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET:-bankflow_dev_jwt_secret_key_32_chars}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-bankflow_dev_jwt_secret_key_32_chars}
  REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-4a8c2e6f0b4d8a1c5e9f3b7d1a5c9e3f7a1b5c9d3e7f1a5b9c3d7e1f5a9b3c7d}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-bankflow_redis_secret}
  KAFKA_BROKERS: kafka:9094

x-service-urls: &service-urls
  AUTH_SERVICE_URL: http://auth-service:3001
  USER_SERVICE_URL: http://user-service:3002
  ACCOUNT_SERVICE_URL: http://account-service:3003
  LEDGER_SERVICE_URL: http://ledger-service:3004
  TRANSACTION_SERVICE_URL: http://transaction-service:3005
  PAYMENT_SERVICE_URL: http://payment-service:3006
  BENEFICIARY_SERVICE_URL: http://beneficiary-service:3007
  BANK_SERVICE_URL: http://bank-service:3008
  SETTLEMENT_SERVICE_URL: http://settlement-service:3009
  RECONCILIATION_SERVICE_URL: http://reconciliation-service:3010
  NOTIFICATION_SERVICE_URL: http://notification-service:3011
  PAYMENT_NETWORK_URL: http://payment-network:4000
  EXTERNAL_BANK_URL: http://external-bank:4001

services:

  # ══════════════════════════════════════════
  # INFRASTRUCTURE
  # ══════════════════════════════════════════

  redis:
    image: redis:7.2-alpine
    container_name: bankflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-bankflow_redis_secret}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-bankflow_redis_secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bankflow-network

  kafka:
    image: bitnami/kafka:3.7
    container_name: bankflow-kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    volumes:
      - kafka-data:/bitnami/kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - bankflow-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bankflow-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-bankflow}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-bankflow_rabbit_secret}
      - RABBITMQ_DEFAULT_VHOST=bankflow
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - bankflow-network

  # ══════════════════════════════════════════
  # SIMULATORS
  # ══════════════════════════════════════════

  payment-network:
    build:
      context: .
      dockerfile: simulators/payment-network/Dockerfile
    container_name: bankflow-payment-network
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      <<: *common-env
      PORT: 4000
      EXTERNAL_BANK_URL: http://external-bank:4001
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bankflow-network

  external-bank:
    build:
      context: .
      dockerfile: simulators/external-bank/Dockerfile
    container_name: bankflow-external-bank
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      <<: *common-env
      PORT: 4001
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - bankflow-network

  # ══════════════════════════════════════════
  # MICROSERVICES
  # ══════════════════════════════════════════

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: bankflow-auth
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      <<: *common-env
      PORT: 3001
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-24h}
      REFRESH_TOKEN_EXPIRES_IN_DAYS: ${REFRESH_TOKEN_EXPIRES_IN_DAYS:-7}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bankflow-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: bankflow-user
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      <<: *common-env
      PORT: 3002
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bankflow-network

  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    container_name: bankflow-account
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      <<: *common-env
      PORT: 3003
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bankflow-network

  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    container_name: bankflow-ledger
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      <<: *common-env
      PORT: 3004
      ACCOUNT_SERVICE_URL: http://account-service:3003
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3004/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bankflow-network

  transaction-service:
    build:
      context: .
      dockerfile: services/transaction-service/Dockerfile
    container_name: bankflow-transaction
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      <<: *common-env
      PORT: 3005
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3005/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bankflow-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: bankflow-payment
    restart: unless-stopped
    ports:
      - '3006:3006'
    environment:
      <<: *common-env
      <<: *service-urls
      PORT: 3006
      NETWORK_TIMEOUT_MS: 8000
    depends_on:
      ledger-service:
        condition: service_healthy
      payment-network:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3006/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bankflow-network

  beneficiary-service:
    build:
      context: .
      dockerfile: services/beneficiary-service/Dockerfile
    container_name: bankflow-beneficiary
    restart: unless-stopped
    ports:
      - '3007:3007'
    environment:
      <<: *common-env
      PORT: 3007
      ACCOUNT_SERVICE_URL: http://account-service:3003
      BANK_SERVICE_URL: http://bank-service:3008
    depends_on:
      account-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3007/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bankflow-network

  bank-service:
    build:
      context: .
      dockerfile: services/bank-service/Dockerfile
    container_name: bankflow-bank
    restart: unless-stopped
    ports:
      - '3008:3008'
    environment:
      <<: *common-env
      PORT: 3008
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3008/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bankflow-network

  settlement-service:
    build:
      context: .
      dockerfile: services/settlement-service/Dockerfile
    container_name: bankflow-settlement
    restart: unless-stopped
    ports:
      - '3009:3009'
    environment:
      <<: *common-env
      PORT: 3009
      PAYMENT_SERVICE_URL: http://payment-service:3006
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3009/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bankflow-network

  reconciliation-service:
    build:
      context: .
      dockerfile: services/reconciliation-service/Dockerfile
    container_name: bankflow-reconciliation
    restart: unless-stopped
    ports:
      - '3010:3010'
    environment:
      <<: *common-env
      PORT: 3010
      LEDGER_SERVICE_URL: http://ledger-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3006
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3010/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bankflow-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: bankflow-notification
    restart: unless-stopped
    ports:
      - '3011:3011'
    environment:
      <<: *common-env
      PORT: 3011
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3011/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bankflow-network

  # ══════════════════════════════════════════
  # API GATEWAY
  # ══════════════════════════════════════════

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: bankflow-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      <<: *common-env
      <<: *service-urls
      PORT: 3000
      ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - bankflow-network

  # ══════════════════════════════════════════
  # FRONTEND (Nginx + Vite build)
  # ══════════════════════════════════════════

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ''  # Empty = uses relative /api/v1 proxied by nginx
    container_name: bankflow-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bankflow-network
